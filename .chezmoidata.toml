# tmux plugins (github.com/tmux-plugins/<name>): cloned by .chezmoiexternal,
# loaded by tpm via .tmux.conf. tmux-open is extra, loaded only outside ssh.
tmuxPlugins = ["tmux-pain-control", "tmux-sidebar", "tmux-yank", "tmux-resurrect"]

# Release binaries, installed in ~/.local/bin by .chezmoiexternal.toml.tmpl and
# refreshed weekly. Linux uses these where apt's are missing (Ubuntu 24.04) or
# old; Macs use them because Homebrew no longer builds Intel bottles.
# Placeholders: {tag} release tag, {ver} tag without "v", {os} linux/darwin,
# {Os} Linux/Darwin, {go} amd64/arm64, {rust} x86_64/aarch64,
# {rustos} unknown-linux-musl/apple-darwin, {glow} x86_64/arm64,
# {tldr} linux-x86_64-musl/macos-aarch64 and so on.
# repo@tag pins a release instead of following the latest.
releases = [
    # binary, repo, platforms, release file, path of the binary inside it,
    # path of its man page inside it ("" if it has none)
    ["zellij",   "zellij-org/zellij",  "linux darwin", "zellij-{rust}-{rustos}.tar.gz",
                 "zellij", ""],
    ["starship", "starship/starship",  "linux darwin", "starship-{rust}-{rustos}.tar.gz",
                 "starship", ""],
    ["fzf",      "junegunn/fzf",       "linux darwin", "fzf-{ver}-{os}_{go}.tar.gz",
                 "fzf", ""],
    ["glow",     "charmbracelet/glow", "linux darwin", "glow_{ver}_{Os}_{glow}.tar.gz",
                 "glow_{ver}_{Os}_{glow}/glow", "glow_{ver}_{Os}_{glow}/manpages/glow.1.gz"],
    ["dust",     "bootandy/dust",      "linux darwin", "dust-{tag}-{rust}-{rustos}.tar.gz",
                 "dust-{tag}-{rust}-{rustos}/dust", ""],
    ["atuin",    "atuinsh/atuin",      "linux darwin", "atuin-{rust}-{rustos}.tar.gz",
                 "atuin-{rust}-{rustos}/atuin", ""],
    ["rg",       "BurntSushi/ripgrep", "darwin",       "ripgrep-{ver}-{rust}-{rustos}.tar.gz",
                 "ripgrep-{ver}-{rust}-{rustos}/rg", "ripgrep-{ver}-{rust}-{rustos}/doc/rg.1"],
    ["fd",       "sharkdp/fd",         "darwin",       "fd-{tag}-{rust}-{rustos}.tar.gz",
                 "fd-{tag}-{rust}-{rustos}/fd", "fd-{tag}-{rust}-{rustos}/fd.1"],
    ["bat",      "sharkdp/bat",        "darwin",       "bat-{tag}-{rust}-{rustos}.tar.gz",
                 "bat-{tag}-{rust}-{rustos}/bat", "bat-{tag}-{rust}-{rustos}/bat.1"],
    ["zoxide",   "ajeetdsouza/zoxide", "darwin",       "zoxide-{ver}-{rust}-{rustos}.tar.gz",
                 "zoxide", "man/man1/zoxide.1"],
    # gh has a page per subcommand too; those repeat `gh <command> --help`
    ["gh",       "cli/cli",            "darwin",       "gh_{ver}_macOS_{go}.zip",
                 "gh_{ver}_macOS_{go}/bin/gh", "gh_{ver}_macOS_{go}/share/man/man1/gh.1"],
    # A bare binary, not an archive: the path inside is ""
    ["tldr",     "tealdeer-rs/tealdeer", "linux darwin", "tealdeer-{tldr}",
                 "", ""],
    ["delta",    "dandavison/delta",   "darwin/arm64", "delta-{ver}-{rust}-{rustos}.tar.gz",
                 "delta-{ver}-{rust}-{rustos}/delta", ""],
    # Last Intel Mac build; brew would compile Rust and LLVM from source
    ["delta",    "dandavison/delta@0.18.2", "darwin/amd64", "delta-{ver}-{rust}-{rustos}.tar.gz",
                 "delta-{ver}-{rust}-{rustos}/delta", ""],
    # Network clipboard. No Linux arm64 build. ~/.piknik.toml holds the shared
    # keys, so it's copied to each host by hand, never kept in this repo.
    ["piknik",   "jedisct1/piknik",    "linux/amd64",  "piknik-linux_x86_64-{ver}.tar.gz",
                 "linux-x86_64/piknik", ""],
    ["piknik",   "jedisct1/piknik",    "darwin/arm64", "piknik-macos-{ver}.tar.gz",
                 "macos/piknik", ""],
    ["piknik",   "jedisct1/piknik",    "darwin/amd64", "piknik-macos-intel-{ver}.tar.gz",
                 "macos/piknik", ""],
]

# Files a release download leaves out, fetched at the same tag as the binary
# (on the platforms that get it, Linux and Macs): from the project's repo
# (raw/...) or as a separate release asset (releases/download/...)
repoFiles = [
    # target                                   repo                    URL path under github.com/<repo>/
    [".local/share/zsh/site-functions/_dust", "bootandy/dust",        "raw/{tag}/completions/_dust"],
    [".local/share/man/man1/dust.1",          "bootandy/dust",        "raw/{tag}/man-page/dust.1"],
    [".local/share/man/man1/fzf.1",           "junegunn/fzf",         "raw/{tag}/man/man1/fzf.1"],
    [".local/share/zsh/site-functions/_tldr", "tealdeer-rs/tealdeer", "releases/download/{tag}/completions_zsh"],
]

# GitHub accounts. Both accounts' SSH keys may log in and are trusted signers;
# commits are signed with the key of the account that matches the commit email.
[github]
    personal = "rstad"
    work = "chimerstad"

# Installed by run_onchange_after_install-packages when missing; upgrades are
# left to apt/brew. Everything else comes from `releases` below. gh on Linux
# comes from GitHub's own apt repo.
[packages]
    apt = ["zsh", "tmux", "vim", "git", "curl", "tree", "gh",
           "ripgrep", "fd-find", "bat", "zoxide", "eza", "git-delta"]
    # No Mac release binaries for these
    brew = ["tmux", "tree", "eza"]
    # WSL hosts with 1Password only: bridges the Windows ssh agent
    wsl1password = ["socat"]
